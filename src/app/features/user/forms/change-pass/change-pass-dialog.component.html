<mat-dialog-content [formGroup]="passwordForm">
    <h2 class="custom-title">User Information</h2>
    <p class="custom-subtitle">Update your personal information and account details.</p>
    <div *ngIf="notifyMessage()" class="error-msg" [class]="isSuccess() ? 'primary' : 'warn'">
        <mat-icon>
            {{ isSuccess() ? 'check_circle' : 'error_outline' }}
        </mat-icon>
        <span>{{ notifyMessage() }}</span>
    </div>
    <div class="grid-fields">
        <mat-form-field class="custom-form">
            <mat-label>Current Password</mat-label>
            <input matInput placeholder="Enter your current password" type="password" formControlName="oldPassword">
        </mat-form-field>
        <mat-form-field class="w-full custom-form">
            <mat-label>New Password</mat-label>
            <input matInput placeholder="Enter your new password" type="password" formControlName="newPassword">
        </mat-form-field>
    </div>

</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="dialogRef.close()">Cancel</button>
    <button matButton (click)="confirmChanges()" cdkFocusInitial>Save</button>
</mat-dialog-actions>

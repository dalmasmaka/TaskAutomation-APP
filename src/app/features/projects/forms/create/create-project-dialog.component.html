<mat-dialog-content>
    <h2 class="custom-title">Create Project</h2>
    <p class="custom-subtitle">Add project details.</p>
    <form [formGroup]="firstFormGroup" class="grid-fields">
        <ng-template matStepLabel>Project Information</ng-template>

        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput placeholder="Project Name" formControlName="name" required>
        </mat-form-field>
        <app-multi-select [items]="availableTeams()" bindLabel="teamName" bindValue="teamId" , placeholder="Select Teams"
          formControlName="teams">
        </app-multi-select>
        <mat-form-field appearance="outline">
            <mat-label>Provider</mat-label>
            <input matInput placeholder="Ex. GitHub" formControlName="provider" required>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Repository Name</mat-label>
            <input matInput placeholder="Ex. yourrepo" formControlName="repoName" required>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Repository Owner</mat-label>
            <input matInput placeholder="Ex. yourusername" formControlName="repoOwner" required>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Default Branch</mat-label>
            <input matInput placeholder="Ex. main" formControlName="defaultBranch" required>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Access Token</mat-label>
            <input matInput placeholder="Enter your access token" formControlName="accessToken" required>
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="dialogRef.close()">Cancel</button>

    <button mat-button color="primary" (click)="confirmChanges()" [disabled]="!firstFormGroup.valid">
        Save
    </button>
</mat-dialog-actions>

<form [formGroup]="LoginForm" (ngSubmit)="onLogin()">
  <p class="custom-title">Login in to your workspace</p>
<div *ngIf="errorMessage as msg" class="error-msg">
  <mat-icon>error_outline</mat-icon>
  <span>{{ msg }}</span>
</div>
  <mat-form-field class=" custom-form">
    <mat-label>Email</mat-label>
    <mat-icon matPrefix>person</mat-icon>
    <input matInput placeholder="Enter your email" type="email" formControlName="email">
  </mat-form-field>
  <mat-form-field class="w-full custom-form">
    <mat-label>Password</mat-label>
    <mat-icon matPrefix>lock</mat-icon>
    <input matInput placeholder="Enter your password" type="password" formControlName="password">
  </mat-form-field>
  <button type="button" (click)="forgotPasswordClicked.emit()" class="redirect-btn">
    Forgot Password?
  </button>
  <button type="submit" matButton="elevated" appearance="outline" color="primary">Login</button>
</form>

<form [formGroup]="forgotPasswordForm">
    <p class="custom-title">Reset your password</p>
    <p class="custom-subtitle">Enter your email address to receive a password reset link.</p>
    <!-- <mat-divider></mat-divider> -->
    <div class="error-msg"  *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span class="error">
            {{ errorMessage }}
        </span>
    </div>
    <div class="success-msg" *ngIf="successMessage">
        <mat-icon>check_circle</mat-icon>
        <span class="success" >
            {{ successMessage }}
        </span>
    </div>

    <mat-form-field class="w-full custom-form">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput placeholder="Enter your email" type="email" formControlName="email">
    </mat-form-field>
    <button type="submit" matButton="elevated" (click)="onSubmit()" appearance="outline" color="primary"
        [disabled]="forgotPasswordForm.invalid">Send Reset Link</button>
</form>

<form formGroup="ForgotPasswordForm" >
    <p class="custom-title">Reset your password</p>
    <mat-form-field class="w-full custom-form">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput placeholder="Enter your email" type="email" formControlName="email">
    </mat-form-field>
    <button type="button"  matButton="elevated" appearance="outline" color="primary">Send Reset Link</button>
</form>

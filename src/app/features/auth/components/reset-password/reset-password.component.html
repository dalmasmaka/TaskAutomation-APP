<div class="auth-container">
    <div class="glass-card">

        <form [formGroup]="resetPasswordForm">
            <p class="custom-title">Reset your password</p>
            <div class="error-msg" *ngIf="errorMessage">
                <mat-icon>error_outline</mat-icon>
                <span class="error">
                    {{ errorMessage }}
                </span>
            </div>
            <div class="success-msg" *ngIf="successMessage">
                <mat-icon>check_circle</mat-icon>
                <span class="success">
                    {{ successMessage }}
                </span>
            </div>

            <mat-form-field class="w-full custom-form">
                <mat-label>New Password</mat-label>
                <mat-icon matPrefix>lock</mat-icon>
                <input matInput placeholder="Enter your new password" type="password" formControlName="password">
            </mat-form-field>
            <button type="submit" matButton="elevated" (click)="onSubmit()" appearance="outline" color="primary"
                [disabled]="resetPasswordForm.invalid">Reset Password</button>
        </form>
        <button class="redirect-btn" (click)="goToLogin()">
    Switch to Login
</button>

    </div>
</div>

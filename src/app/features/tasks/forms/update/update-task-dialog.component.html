<mat-dialog-content [formGroup]="taskForm">
    <h2 class="custom-title">Task Details</h2>
    <p class="custom-subtitle">Update your task details.</p>
    <mat-tab-group>
        <mat-tab label="Details">
            <div class="sm-padding">
                <div class="grid-fields">
                    <mat-form-field class="custom-form" appearance="outline">
                        <mat-label>Title</mat-label>
                        <input matInput placeholder="Enter task title" type="text" formControlName="title">
                    </mat-form-field>
                    <mat-form-field class="custom-form" appearance="outline">
                        <mat-label>Description</mat-label>
                        <textarea matInput cdkTextareaAutosize #autosize="cdkTextareaAutosize" cdkAutosizeMinRows="6"
                            cdkAutosizeMaxRows="25" formControlName="description"></textarea>
                    </mat-form-field>
                </div>

                <div class="flex-fields">
                    <div class="flex-one">
                        <app-select [items]="statuses" bindLabel="name" bindValue="id" , placeholder="Select Status"
                            formControlName="status"> </app-select>
                    </div>
                    <div class="flex-one">
                        <app-select [items]="priorities" bindLabel="name" bindValue="id" , placeholder="Set Priority"
                            formControlName="priority"> </app-select>
                    </div>
                </div>
                <app-multi-select [items]="projectTeam()" bindLabel="email" bindValue="id" , placeholder="Assign Users"
                    formControlName="members">
                </app-multi-select>
            </div>
        </mat-tab>
        <mat-tab label="Asignees">
            <div class="members-list">
                <div class="box">
                    <mat-list class="example-list-wrapping">
                        @for(member of taskMembers(); track member.id){
                        <div class="flex-fields">
                            <div mat-card-avatar class="avatar-display"
                                [style.background-color]="getAvatarTheme(member.fullName).bg"
                                [style.color]="getAvatarTheme(member.fullName).text">
                                {{ getInitials(member.fullName) }}
                            </div>
                            <mat-list-item class="custom-item">

                                <span matListItemTitle>{{ member.email }}</span>
                                <span matListItemLine>
                                    {{member.fullName}}
                                </span>
                                <div matListItemMeta>
                                    <app-menu #menuComp [items]="configMenuItems" [context]="member"
                                        (itemClick)="handleMenuAction($event)"></app-menu>
                                </div>
                            </mat-list-item>
                            
                        </div>
                        <mat-divider></mat-divider>
                        }
                    </mat-list>
                </div>
            </div>
        </mat-tab>
    </mat-tab-group>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="dialogRef.close()">Cancel</button>
    <button matButton (click)="confirmChanges()" cdkFocusInitial>Save</button>
</mat-dialog-actions>

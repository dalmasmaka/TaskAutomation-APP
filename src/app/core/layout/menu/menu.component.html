<mat-icon class="custom-icon" [matMenuTriggerFor]="menu">
  more_vert
</mat-icon>
<mat-menu #menu="matMenu" class="custom-menu">
  @for (item of items; track item.label) {
  <button mat-menu-item (click)="onClick(item)">
    @if (item.icon) {
    <mat-icon fontSet="material-symbols-outlined" class="custom-mat-icon">{{ item.icon }}</mat-icon>
    }
    <span>{{ item.label }}</span>
  </button>
  }
</mat-menu>

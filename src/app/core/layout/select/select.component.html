<mat-form-field appearance="outline" style="width: 100%;">
  <mat-label>{{ placeholder }}</mat-label>
   <mat-select
    [value]="value"
    (selectionChange)="updateValue($event.value)"
    (openedChange)="searchControl.setValue('')"
  >
    <mat-divider></mat-divider>
        <mat-option class="search-option">
      <input matInput
             placeholder="Search..."
             [formControl]="searchControl"
             (click)="$event.stopPropagation()"
             class="search-input">
    </mat-option>
    <mat-option *ngFor="let item of filteredItems$ | async" [value]="item[bindValue]">
      {{ item[bindLabel] }}
    </mat-option>
    
    <mat-option *ngIf="(filteredItems$ | async)?.length === 0" disabled>
      No results found
    </mat-option>
  </mat-select>
</mat-form-field>

<mat-sidenav-container class="h-[100dvh]">
    <mat-sidenav class="w-[288px]! border-r border-outline-variant!" [opened]="true" mode="side">
        <div class="flex flex-col h-full">
            <div class="flex-grow overflow-y-auto">
                <mat-nav-list>
                    <mat-list-item><mat-icon matListItemIcon>dashboard</mat-icon>Dashboard</mat-list-item>

                    <ng-container *ngIf="jwtService.hasRole('Owner')">
                        <mat-list-item routerLink="/company" routerLinkActive="active-list-item"><mat-icon
                                matListItemIcon>settings</mat-icon>Company</mat-list-item>
                        <mat-list-item routerLink="/profile"><mat-icon matListItemIcon>settings</mat-icon>Personal
                            Information</mat-list-item>
                        <mat-list-item routerLink="/team"><mat-icon
                                matListItemIcon>groups</mat-icon>Team</mat-list-item>
                        <h3 matSubheader>Projects Management</h3>
                        <mat-list-item routerLink="/projects"><mat-icon
                                matListItemIcon>workspaces</mat-icon>Projects</mat-list-item>
                        <mat-list-item routerLink="/tasks"><mat-icon
                                matListItemIcon>assignment</mat-icon>Tasks</mat-list-item>
                        <mat-list-item routerLink="/pull-requests"><mat-icon matListItemIcon>merge_type</mat-icon>Pull
                            equests</mat-list-item>
                    </ng-container>

                    <ng-container *ngIf="jwtService.hasRole('Developer')">

                            Information</mat-list-item>
                        <mat-list-item routerLink="/team"><mat-icon
                                matListItemIcon>groups</mat-icon>Team</mat-list-item>
                        <mat-list-item routerLink="/projects"><mat-icon
                                matListItemIcon>workspaces</mat-icon>Projects</mat-list-item>
                        <h3 matSubheader>Your Projects</h3>
                        <mat-accordion displayMode="flat">

            <mat-expansion-panel-header class="px-4!">
              <mat-panel-title class="flex items-center">

                  {{ project.name[0] | uppercase }}
                </span>
                {{ project.name }}
              </mat-panel-title>

                    </ng-container>
                </mat-nav-list>
            </div>

            <div class="absolute bottom-0 w-full border-t border-outline-variant">
                <mat-action-list>
                    <mat-list-item>
                        <img matListItemAvatar src="https://avatars.githubusercontent.com/u/105328?v=4" alt="User"
                            class="object-cover" />
                        <span matListItemTitle>Dalma</span>
                        <span matListItemLine>Smaka</span>
                    </mat-list-item>

            </div>
        </div>
    </mat-sidenav>
